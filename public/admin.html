<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kanairo Mix — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
  <style>
    :root {
      --bg: #09090b;
      --surface: #18181b;
      --surface-2: #27272a;
      --surface-3: #3f3f46;
      --border: #27272a;
      --text: #f4f4f5;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;
      --primary: #3b82f6;
      --primary-light: #60a5fa;
      --primary-glow: rgba(59, 130, 246, 0.25);
      --secondary: #06b6d4;
      --success: #10b981;
      --danger: #ef4444;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 10px 40px rgba(0,0,0,0.4);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; -webkit-font-smoothing: antialiased;
    }

    /* ===== HEADER ===== */
    .admin-header {
      background: rgba(24, 24, 27, 0.85);
      backdrop-filter: blur(16px) saturate(1.2);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 100;
    }
    .admin-brand {
      font-size: 20px; font-weight: 800; letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      display: flex; align-items: center; gap: 8px;
    }
    .admin-brand .material-symbols-outlined {
      font-size: 26px; -webkit-text-fill-color: var(--primary);
    }
    .stats-bar { display: flex; gap: 24px; }
    .stat-box { text-align: center; }
    .stat-value {
      font-size: 24px; font-weight: 700; color: var(--primary-light);
      font-family: 'JetBrains Mono', monospace; letter-spacing: -1px;
    }
    .stat-label {
      font-size: 10px; color: var(--text-muted); text-transform: uppercase;
      letter-spacing: 1.5px; font-weight: 700; margin-top: 2px;
    }

    /* ===== LAYOUT ===== */
    .container {
      max-width: 1300px; margin: 0 auto; padding: 24px;
      display: grid; grid-template-columns: 380px 1fr; gap: 24px;
    }
    .panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    .panel h2 {
      font-size: 16px; font-weight: 700; margin-bottom: 20px;
      display: flex; align-items: center; gap: 10px;
    }
    .panel h2 .material-symbols-outlined { color: var(--primary); }

    /* ===== FORM ===== */
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block; font-size: 12px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.8px;
      margin-bottom: 6px; color: var(--text-secondary);
    }
    .form-group input, .form-group textarea {
      width: 100%; padding: 12px 14px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text);
      font-family: inherit; font-size: 14px; outline: none;
      transition: all 0.2s;
    }
    .form-group input:focus, .form-group textarea:focus {
      border-color: var(--primary);
      background: var(--surface-2);
      box-shadow: 0 0 0 4px var(--primary-glow);
    }
    .form-group input::placeholder, .form-group textarea::placeholder { color: var(--text-muted); }
    .form-group textarea { min-height: 80px; resize: vertical; line-height: 1.5; }
    .file-input-wrap {
      position: relative; padding: 24px 16px;
      background: var(--bg); border: 2px dashed var(--surface-3);
      border-radius: var(--radius-sm); text-align: center;
      cursor: pointer; transition: all 0.2s;
    }
    .file-input-wrap:hover { border-color: var(--primary); background: var(--surface-2); }
    .file-input-wrap input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .file-input-wrap .material-symbols-outlined {
      font-size: 40px; color: var(--primary-light); margin-bottom: 8px;
    }
    .file-input-wrap p { font-size: 13px; color: var(--text-muted); font-weight: 500; }
    .file-input-wrap .file-name {
      font-size: 12px; color: var(--secondary); margin-top: 6px; font-weight: 600;
    }

    .btn {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border: none; border-radius: var(--radius-sm);
      color: #fff; font-family: inherit; font-size: 14px; font-weight: 700;
      cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      letter-spacing: 0.3px;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px var(--primary-glow); }
    .btn:active { transform: translateY(0); }
    .btn:disabled {
      opacity: 0.6; cursor: not-allowed; transform: none;
      box-shadow: none;
    }
    .btn-danger { background: var(--danger); }
    .btn-danger:hover { box-shadow: 0 8px 24px rgba(239,68,68,0.3); background: #f87171; }
    .btn-sm { padding: 8px 14px; font-size: 12px; width: auto; }

    /* ===== VIDEO LIST ===== */
    .video-list { display: flex; flex-direction: column; gap: 12px; }
    .video-item {
      display: flex; gap: 12px; padding: 12px;
      background: var(--bg); border-radius: var(--radius-sm);
      border: 1px solid var(--border); align-items: flex-start;
      transition: all 0.2s;
    }
    .video-item:hover { border-color: var(--primary); background: var(--surface-2); }
    .video-item video, .video-item img {
      width: 120px; height: 68px; object-fit: cover;
      border-radius: 6px; background: #000; flex-shrink: 0;
    }
    .video-item-info { flex: 1; min-width: 0; }
    .video-item-title {
      font-weight: 600; font-size: 14px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 4px; color: var(--text);
    }
    .video-item-desc {
      font-size: 12px; color: var(--text-secondary); line-height: 1.4;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; margin-bottom: 6px;
    }
    .video-item-meta {
      font-size: 11px; color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      display: flex; gap: 12px; align-items: center;
    }
    .video-item-meta span { display: flex; align-items: center; gap: 4px; }
    .video-item-actions { display: flex; gap: 6px; flex-direction: column; }
    .video-item-actions button {
      background: var(--surface-2); border: 1px solid var(--border); color: var(--text-muted);
      cursor: pointer; padding: 6px; display: flex; align-items: center;
      border-radius: 6px; transition: all 0.2s;
    }
    .video-item-actions button:hover { color: #fff; background: var(--primary); border-color: var(--primary); }
    .video-item-actions button.delete:hover { color: #fff; background: var(--danger); border-color: var(--danger); }

    /* ===== PROCESSING MODAL ===== */
    .processing-overlay {
      position: fixed; inset: 0; z-index: 400;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      display: none; align-items: center; justify-content: center;
      flex-direction: column;
    }
    .processing-overlay.active { display: flex; }
    .processing-spinner {
      width: 56px; height: 56px;
      border: 4px solid var(--surface-3);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .processing-text {
      font-size: 16px; font-weight: 700; color: var(--text);
      text-align: center;
    }
    .processing-sub {
      font-size: 13px; color: var(--text-muted); margin-top: 6px;
    }

    /* ===== TOAST ===== */
    .toast {
      position: fixed; bottom: 24px; right: 24px; z-index: 300;
      padding: 14px 20px; border-radius: var(--radius-sm);
      background: var(--surface-2); border: 1px solid var(--border);
      color: var(--text); font-weight: 600; font-size: 14px;
      display: flex; align-items: center; gap: 10px;
      transform: translateY(120px); opacity: 0;
      transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
      box-shadow: var(--shadow);
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { border-color: var(--success); color: var(--success); }
    .toast.error { border-color: var(--danger); color: var(--danger); }

    .empty-state {
      text-align: center; padding: 40px; color: var(--text-muted);
      background: var(--bg); border-radius: var(--radius-sm);
      border: 1px dashed var(--surface-3);
    }
    .empty-state .material-symbols-outlined { font-size: 48px; margin-bottom: 12px; opacity: 0.5; color: var(--primary); }

    /* ===== MOBILE ===== */
    @media (max-width: 900px) {
      .container { grid-template-columns: 1fr; padding: 16px; gap: 16px; }
      .stats-bar { gap: 16px; }
      .admin-header { padding: 14px 16px; flex-direction: column; gap: 12px; align-items: flex-start; }
      .admin-brand { font-size: 18px; }
      .stat-value { font-size: 20px; }
      .video-item video, .video-item img { width: 100px; height: 56px; }
      .panel { padding: 18px; }
      .video-item-actions { flex-direction: row; }
    }
    @media (max-width: 480px) {
      .video-item { flex-direction: column; }
      .video-item video, .video-item img { width: 100%; height: 160px; }
      .video-item-actions { flex-direction: row; width: 100%; justify-content: flex-end; }
    }
  </style>
</head>
<body>
  <div class="admin-header">
    <div class="admin-brand">
      <span class="material-symbols-outlined">admin_panel_settings</span>
      <span>KanairoMix Admin</span>
    </div>
    <div class="stats-bar">
      <div class="stat-box">
        <div class="stat-value" id="statVideos">0</div>
        <div class="stat-label">Videos</div>
      </div>
      <div class="stat-box">
        <div class="stat-value" id="statViews">0</div>
        <div class="stat-label">Views</div>
      </div>
      <div class="stat-box">
        <div class="stat-value" id="statCats">0</div>
        <div class="stat-label">Categories</div>
      </div>
    </div>
  </div>

  <div class="container">
    <!-- LEFT: UPLOAD -->
    <div class="panel">
      <h2><span class="material-symbols-outlined">cloud_upload</span> Upload Video</h2>
      <form id="uploadForm" enctype="multipart/form-data">
        <div class="form-group">
          <label>Title</label>
          <input type="text" name="title" required placeholder="Enter video title">
        </div>
        <div class="form-group">
          <label>Video File (auto-capped to 10s preview)</label>
          <div class="file-input-wrap" id="videoDrop">
            <span class="material-symbols-outlined">upload_file</span>
            <p>Click or drag video here</p>
            <p class="file-name" id="videoName"></p>
            <input type="file" name="video" accept="video/*" required id="videoFile">
          </div>
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea name="description" placeholder="Write a description..."></textarea>
        </div>
        <div class="form-group">
          <label>Category</label>
          <input type="text" name="category" placeholder="e.g. Trending, Kenyan">
        </div>
        <button type="submit" class="btn" id="uploadBtn">
          <span class="material-symbols-outlined">cloud_upload</span> Upload & Generate Preview
        </button>
      </form>
    </div>

    <!-- RIGHT: VIDEO LIST -->
    <div class="panel">
      <h2><span class="material-symbols-outlined">video_library</span> Manage Videos</h2>
      <div id="videoList" class="video-list">
        <div class="empty-state">
          <span class="material-symbols-outlined">hourglass_empty</span>
          <p>Loading videos...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- PROCESSING MODAL -->
  <div class="processing-overlay" id="processingModal">
    <div class="processing-spinner"></div>
    <div class="processing-text">Uploading & Generating Preview...</div>
    <div class="processing-sub">Please wait, do not close this page</div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const ADMIN_TOKEN = localStorage.getItem('km_token') || prompt('Enter admin token:');
    if (ADMIN_TOKEN) localStorage.setItem('km_token', ADMIN_TOKEN);

    function showToast(msg, type = 'success') {
      const t = document.getElementById('toast');
      t.innerHTML = `<span class="material-symbols-outlined">${type === 'success' ? 'check_circle' : 'error'}</span> ${msg}`;
      t.className = 'toast ' + type + ' show';
      setTimeout(() => t.classList.remove('show'), 3500);
    }

    function setProcessing(active) {
      const modal = document.getElementById('processingModal');
      const btn = document.getElementById('uploadBtn');
      if (active) {
        modal.classList.add('active');
        btn.disabled = true;
      } else {
        modal.classList.remove('active');
        btn.disabled = false;
      }
    }

    async function api(url, opts = {}) {
      const res = await fetch(url, {
        ...opts,
        headers: { 'Authorization': 'Bearer ' + ADMIN_TOKEN, ...(opts.headers || {}) }
      });
      if (res.status === 401) {
        localStorage.removeItem('km_token');
        alert('Invalid token. Refresh and enter correct token.');
        location.reload();
        return;
      }
      return res;
    }

    // File input display
    document.getElementById('videoFile').addEventListener('change', e => {
      document.getElementById('videoName').textContent = e.target.files[0]?.name || '';
    });

    async function loadStats() {
      try {
        const res = await api('/api/admin/stats');
        const data = await res.json();
        document.getElementById('statVideos').textContent = data.totalVideos;
        document.getElementById('statViews').textContent = data.totalViews.toLocaleString();
        document.getElementById('statCats').textContent = data.categories;
      } catch (e) {}
    }

    async function loadVideos() {
      try {
        const res = await fetch('/api/videos?limit=100');
        const data = await res.json();
        const list = document.getElementById('videoList');
        if (data.videos.length === 0) {
          list.innerHTML = `<div class="empty-state">
            <span class="material-symbols-outlined">videocam_off</span>
            <p>No videos yet. Upload one!</p>
          </div>`;
          return;
        }
        list.innerHTML = data.videos.map(v => `
          <div class="video-item">
            ${v.previewUrl ? `<video muted preload="metadata"><source src="${v.previewUrl}"></video>` : `<img src="${v.thumbnail}" onerror="this.src='/assets/placeholder.jpg'">`}
            <div class="video-item-info">
              <div class="video-item-title">${v.title}</div>
              ${v.description ? `<div class="video-item-desc">${v.description}</div>` : ''}
              <div class="video-item-meta">
                <span><span class="material-symbols-outlined" style="font-size:13px;">folder</span> ${v.category || 'Uncategorized'}</span>
                <span><span class="material-symbols-outlined" style="font-size:13px;">visibility</span> ${(v.views || 0).toLocaleString()}</span>
              </div>
            </div>
            <div class="video-item-actions">
              <button onclick="previewVideo('${v.previewUrl || v.videoUrl}')" title="Preview">
                <span class="material-symbols-outlined">play_arrow</span>
              </button>
              <button class="delete" onclick="deleteVideo('${v.id}')" title="Delete">
                <span class="material-symbols-outlined">delete</span>
              </button>
            </div>
          </div>
        `).join('');
      } catch (e) {
        document.getElementById('videoList').innerHTML = `<div class="empty-state">Error loading videos</div>`;
      }
    }

    // Upload form
    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      setProcessing(true);

      const formData = new FormData(e.target);
      try {
        const res = await api('/api/admin/upload', { method: 'POST', body: formData });
        if (res.ok) {
          showToast('Upload complete! 10s preview generated.');
          e.target.reset();
          document.getElementById('videoName').textContent = '';
          loadVideos(); loadStats();
        } else {
          const err = await res.json();
          showToast(err.error || 'Upload failed', 'error');
        }
      } catch (e) { showToast('Network error', 'error'); }
      finally { setProcessing(false); }
    });

    async function deleteVideo(id) {
      if (!confirm('Delete this video permanently?')) return;
      try {
        const res = await api('/api/admin/videos/' + id, { method: 'DELETE' });
        if (res.ok) { showToast('Deleted'); loadVideos(); loadStats(); }
        else { showToast('Delete failed', 'error'); }
      } catch (e) { showToast('Error', 'error'); }
    }

    function previewVideo(url) { window.open(url, '_blank'); }

    loadStats();
    loadVideos();
  </script>
</body>
</html>
